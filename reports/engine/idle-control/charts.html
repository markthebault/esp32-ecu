<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
 body{font-family:var(--font-sans,system-ui);color:var(--foreground);margin:0}select{background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius,8px);padding:8px;max-width:100%}.chart{overflow:auto;margin-top:10px}.chart[hidden]{display:none}.chart img{display:block;width:100%;min-width:640px;height:540px;object-fit:contain}p{color:var(--muted-foreground,#777);font-size:13px;line-height:1.45}label{font-size:14px}</style></head><body><label for="case">Experiment </label><select id="case" onchange="document.querySelectorAll('.chart').forEach((x,i)=>x.hidden=i!==this.selectedIndex)"><option>Load step: executed output, valve and RPM</option><option>Disconnected, stuck-open and inverted drive</option><option>Reachable target with explicit model tune</option><option>Reference PWM after production disable</option></select><div class="chart" ><img src="idle-load-step.svg" alt="Load step: executed output, valve and RPM"></div><div class="chart" hidden><img src="idle-actuator-faults.svg" alt="Disconnected, stuck-open and inverted drive"></div><div class="chart" hidden><img src="idle-reachable-target.svg" alt="Reachable target with explicit model tune"></div><div class="chart" hidden><img src="idle-reference-disable.svg" alt="Reference PWM after production disable"></div><p>Uncalibrated Modelica air path plus empirical combustion and valve. Native controller code, virtual GPIO, zero CPU/IRQ cost. Shaded interval: added load. No physical engine qualification. Scroll figures horizontally on narrow screens.</p></body></html>

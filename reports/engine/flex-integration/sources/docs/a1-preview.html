<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:var(--font-sans);color:var(--foreground)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{padding:9px 14px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:8px;cursor:pointer}button.active{background:var(--primary);color:var(--primary-foreground)}figure{margin:0;background:var(--card);border-radius:var(--radius);padding:12px}img{display:block;width:100%;height:440px;object-fit:contain}p{font-size:13px;line-height:1.5;color:var(--muted-foreground)}@media(max-width:450px){img{height:300px}}</style></head><body><nav><button data-view="box" class="active">Printable enclosure</button><button data-view="pcb">PCB 3D</button><button data-view="layout">Top layout</button></nav><figure><img id="picture" alt="A1 enclosure base and lid"><p id="caption"></p></figure><p>A1: 200 × 200 mm PCB · 218 × 218 × 47 mm assembled box · 8 individual sensor plugs. Bench prototype; physical fit and vehicle qualification pending.</p><script>const views={"box": ["/Users/markthebault/.t3/projects/esp32-ecu/enclosure/enclosure-3d.png", "Actual printable base and lid geometry. Green surface represents the PCB envelope; electronics and harnesses are not shown."], "pcb": ["/Users/markthebault/.t3/projects/esp32-ecu/reports/a1/pcb-3d.png", "KiCad render of the routed carrier. Purchased ESP32 and converter module bodies are omitted from this view."], "layout": ["/Users/markthebault/.t3/projects/esp32-ecu/reports/a1/pcb-top.png", "Routed top copper and sensor socket identification. See the assembly SVG for component reference designators."]};function show(k){document.getElementById('picture').src=views[k][0];document.getElementById('caption').textContent=views[k][1];document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===k))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.view));show('box');</script></body></html>

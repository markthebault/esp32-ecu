<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}button{font:inherit;border:1px solid var(--border);border-radius:8px;padding:8px 14px;background:var(--secondary);color:var(--foreground);cursor:pointer}button.active{background:var(--primary);color:var(--primary-foreground)}.stage{height:520px;overflow:auto;border-radius:var(--radius);background:var(--card);text-align:center}img{width:100%;height:100%;object-fit:contain;display:block}p{font-size:13px;color:var(--muted-foreground);line-height:1.5;margin:10px 0}label{font-size:13px;margin-left:auto}input{width:90px;vertical-align:middle}@media(max-width:450px){.stage{height:380px}label{margin-left:0}}
</style></head><body><div class="controls"><button class="active" data-view="3d">3D assembly</button><button data-view="top">Top layout</button><button data-view="bottom">Bottom layout</button><label>Zoom <input id="zoom" aria-label="Zoom" type="range" min="100" max="250" value="100"></label></div><div class="stage"><img id="board" alt="KiCad 3D assembly view"></div><p id="caption"></p><p>200 × 200 mm · 4 copper layers · A0 bench prototype · Not vehicle qualified. 3D view is a KiCad ray-traced image; component models represent package geometry.</p><script>
const images={"3d": "/Users/markthebault/.t3/projects/esp32-ecu/reports/pcb-3d.png", "top": "/Users/markthebault/.t3/projects/esp32-ecu/reports/pcb-top.png", "bottom": "/Users/markthebault/.t3/projects/esp32-ecu/reports/pcb-bottom.png"}; const captions={'3d':'KiCad 3D assembly render. Use zoom and scroll to inspect components.','top':'Top copper, pads and silkscreen exported from the routed KiCad PCB.','bottom':'Bottom layout exported from the routed KiCad PCB.'}; const board=document.getElementById('board'),zoom=document.getElementById('zoom');function select(v){board.src=images[v];board.alt=captions[v];document.getElementById('caption').textContent=captions[v];document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));zoom.value=100;resize()}function resize(){board.style.width=zoom.value+'%';board.style.height=zoom.value+'%'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.view));zoom.oninput=resize;select('3d');</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--radius:10px;--font-sans:system-ui,sans-serif;--background:transparent;--foreground:#e8edeb;--muted-foreground:#a6b2af;--card:#1b2220;--secondary:#27312c;--border:#3b4942;--primary:#b8ee83;--primary-foreground:#182212}*{box-sizing:border-box}html,body{margin:0;font-family:var(--font-sans);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}button{font:12px var(--font-sans);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--foreground);background:var(--secondary);cursor:pointer}button.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}figure{margin:0;padding:16px;background:var(--card);border-radius:var(--radius)}figure[hidden]{display:none}.viewport{overflow:auto;max-height:700px}.zoomed img{width:1280px;max-width:none;max-height:none}img{display:block;width:100%;height:auto;max-height:700px;object-fit:contain;border-radius:5px}figcaption{margin-top:12px;font-size:12px;line-height:1.6;color:var(--muted-foreground)}
</style></head><body><nav aria-label="Views"><button class="active">Calibration</button><button>Connection guides</button><button>Diagnostics</button><button>Full manual</button><button>PCB 3D</button><button>Printed case</button><button id="zoom" aria-pressed="false">Zoom</button></nav>
<figure><div class="viewport"><img src="../reports/web/calibration.png" alt="Actual ECU Studio sensor calibration UI with linear curve and live diagnostic values"></div><figcaption>Working configuration UI using labelled simulator data. Calibrations, input limits and filters save as a persistent profile. Engine outputs remain off.</figcaption></figure>
<figure hidden><div class="viewport"><img src="../reports/web/connection-guide.png" alt="Sensor connector guide with mounting steps and fault tracing"></div><figcaption>Per-connector mounting, pinout, electrical checks and fault tracing use the same guide source as the PDF.</figcaption></figure>
<figure hidden><div class="viewport"><img src="../reports/web/diagnostics.png" alt="Live raw ADC and trigger diagnostics with simulated input short"></div><figcaption>Raw ADC, power rails, watchdog, interlock, trigger edges and CAN counts. This capture includes a simulated MAP signal short. Fault-injection controls exist only in the desktop simulator.</figcaption></figure>
<figure hidden><div class="viewport"><img src="../reports/web/full-manual.png" alt="Complete instruction manual reader inside ECU Studio"></div><figcaption>The full 26-page manual text is also available inside the configuration UI, including board assembly and splash-seal instructions.</figcaption></figure>
<figure hidden><div class="viewport"><img src="../reports/a3/pcb-3d.png" alt="KiCad render of the compact through-hole ECU PCB"></div><figcaption>Native KiCad render: 120 × 120 mm, six copper layers, plug-in S3 and ordinary leaded components. Some purchased parts use simplified assembly envelopes; DNP pull-ups are intentionally absent.</figcaption></figure>
<figure hidden><div class="viewport"><img src="../enclosure/a3/enclosure-3d.png" alt="Compact printed enclosure with screw supports and continuous gasket"></div><figcaption>Matching printed case with PCB supports, eight lid screws, continuous gasket groove, gland openings and insulating covers. Nominal CAD checked; physical splash resistance remains untested.</figcaption></figure>
<script>const buttons=[...document.querySelectorAll('nav button:not(#zoom)')],views=[...document.querySelectorAll('figure')];buttons.forEach((button,i)=>button.onclick=()=>{buttons.forEach((b,j)=>b.classList.toggle('active',i===j));views.forEach((v,j)=>v.hidden=i!==j)});document.getElementById('zoom').onclick=()=>{document.body.classList.toggle('zoomed');document.getElementById('zoom').setAttribute('aria-pressed',document.body.classList.contains('zoomed'))};</script></body></html>

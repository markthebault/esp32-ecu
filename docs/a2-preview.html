<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:var(--font-sans);color:var(--foreground)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{padding:9px 13px;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:8px;cursor:pointer}button.active{background:var(--primary);color:var(--primary-foreground)}figure{margin:0;background:var(--card);border-radius:var(--radius);padding:12px}.stage{height:470px;overflow:auto}img{display:block;width:100%;height:100%;object-fit:contain}p{font-size:13px;line-height:1.5;color:var(--muted-foreground)}label{font-size:13px;margin-left:auto}input{width:80px;vertical-align:middle}@media(max-width:450px){.stage{height:340px}label{margin-left:0}}</style></head><body><nav><button class="active" data-view="mounts">PCB mounts</button><button data-view="box">Case and lid</button><button data-view="plan">Mounting plan</button><button data-view="pcb">PCB</button><label>Zoom <input type="range" id="zoom" min="100" max="240" value="100" aria-label="Image zoom"></label></nav><figure><div class="stage"><img id="picture" alt="A2 through-hole PCB"></div><p id="caption"></p></figure><p>Four M3 PCB mounts · eight lid screws · continuous gasket and rain skirt. Sealed glands, gasket and print-surface sealing are required. Physical fit, splash resistance and EMI performance remain untested.</p><script>const views={"pcb": ["/Users/markthebault/.t3/projects/esp32-ecu/reports/a2/pcb-3d.png", "Actual KiCad through-hole layout with directly soldered DIP ICs. ESP32-S3 and converter bodies are assembly envelopes; some connector bodies are omitted by the model library. Carrier: 200 \u00d7 200 mm."], "box": ["/Users/markthebault/.t3/projects/esp32-ecu/enclosure/a2/enclosure-3d.png", "A2-R2 base and lid with dielectric covers. The gasket is cut from 2 mm sheet, not filament printed. Glands, lining and wiring must be fitted. Outer size: 222 \u00d7 222 \u00d7 47 mm."], "assembly": ["/Users/markthebault/.t3/projects/esp32-ecu/reports/a2/assembly.svg", "Actual reference-designator assembly drawing. Match component values and orientation to the A2 BOM and assembly instructions."], "mounts": ["/Users/markthebault/.t3/projects/esp32-ecu/enclosure/a2/pcb-mounts-top.png", "Top view of the actual revised base: four PCB insert supports near the corners, eight lid fasteners outside the blue gasket, and an internal shield bond. Metallic inserts and compressed gasket are reference envelopes."], "plan": ["/Users/markthebault/.t3/projects/esp32-ecu/enclosure/a2/mounting-plan.svg", "Mounting plan: orange marks the four PCB supports, gray marks the eight lid screws, and blue shows the continuous water-seal path."]};const img=document.getElementById('picture'),zoom=document.getElementById('zoom');function resize(){img.style.width=zoom.value+'%';img.style.height=zoom.value+'%'}function show(k){img.src=views[k][0];img.alt=views[k][1];document.getElementById('caption').textContent=views[k][1];document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===k));zoom.value=100;resize()}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.view));zoom.oninput=resize;show('mounts');</script></body></html>

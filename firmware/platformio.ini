[platformio]
src_dir = main
default_envs = compact_n16r8_web

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
build_flags = -std=gnu++17

[env:bench]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_BENCH_PULSES=1


[env:hand_solder_a1]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_HAND_SOLDER_A1=1

[env:through_hole_a2]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_THROUGH_HOLE_A2=1

[env:compact_a3]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_COMPACT_A3=1

[env:compact_a3_web]
extends = env:compact_a3
build_flags = -std=gnu++17 -DECU_COMPACT_A3=1 -DECU_CONFIG_WEB=1

# Selected AliExpress board. Same electrical pin order; socket dimensions still provisional.
# Status LED is a separate WS2812 on GPIO38 because listing RGB47/RGB48 references conflict.
[env:compact_n16r8_web]
extends = env:compact_a3_web
board = esp32-s3-44pin-n16r8
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.n16r8.defaults
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = -std=gnu++17 -DECU_COMPACT_A3=1 -DECU_CONFIG_WEB=1 -DECU_SELECTED_N16R8=1

# Explicit dummy loads only. AP/radio service is omitted. J3 must be closed at
# boot; first gate/supervision fault after arming latches until reset.
[env:compact_a3_timing_bench]
extends = env:compact_a3
build_flags = -std=gnu++17 -DECU_COMPACT_A3=1 -DECU_ENGINE_DUMMY_LOADS=1

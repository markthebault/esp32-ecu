[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
build_flags = -std=gnu++17

[env:bench]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_BENCH_PULSES=1


[env:hand_solder_a1]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_HAND_SOLDER_A1=1

[env:through_hole_a2]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_THROUGH_HOLE_A2=1

[env:compact_a3]
extends = env:esp32s3
build_flags = -std=gnu++17 -DECU_COMPACT_A3=1

[env:compact_a3_web]
extends = env:compact_a3
build_flags = -std=gnu++17 -DECU_COMPACT_A3=1 -DECU_CONFIG_WEB=1
